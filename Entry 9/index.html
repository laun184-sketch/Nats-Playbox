<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Shapeshifting Shadows</title>
	<link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <!-- Section 1: Stage with spotlights -->
    <section id="section1">
        <div id="title">
            <img src="title.gif">
        </div>
        <div class="circle"></div>
        <div class="circle2"></div>
    </section>


    <!-- Section 2: Blurb section -->
    <section id="section2">
        <div id="blurb">
            <img src="blurb.gif">
        </div>
    </section>


    <!-- Section 3: Cursor follower -->
    <section id="section3">
        <div id="cursorShape"></div>
        <div id="rabbit">
            <img src="rabbit.gif">
            <audio id="rabbitSound" src="rabbit-sound.mp3" loop></audio>
        </div>
        <div id="dog">
            <img src="dog.gif">
            <audio id="dogSound" src="dog-sound.mp3" loop></audio>
        </div>
        <div id="elephant">
            <img src="elephant.gif">
            <audio id="elephantSound" src="elephant-sound.wav" loop></audio>
        </div>
        <div id="moose">
            <img src="moose.gif">
            <audio id="mooseSound" src="moose-sound.ogg" loop></audio>
        </div>
        <div id="bird">
            <img src="bird.gif">
            <audio id="birdSound" src="bird-sound.mp3" loop></audio>
        </div>
    </section>

<script src="script.js"></script>

</body>
</html>
